# Veroeffentlicht den Demo-Bericht (pages/index.html, simulierte Daten) auf GitHub Pages.
# Es wird ausschliesslich der Ordner pages/ veroeffentlicht - nichts sonst aus dem Repository.
# Voraussetzung, einmalig: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Demo-Bericht auf GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - id: deployment
        uses: actions/deploy-pages@v4
