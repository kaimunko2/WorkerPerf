U oder mehr Server.\u000d\u000aTypische Spitzenlast (P95 der Hauptzeit) 93,7 %, höchste Spitze 94,1 %, Ziel\u000d\u000aunter 75 %; wiederkehrend: Kapazität (4 von 5).\u000d\u000aSchätzung, nicht gemessen: Bei der gemessenen Last käme der Server mit etwa 12\u000d\u000astatt 8 vCPU unter 75 %.\u000d\u000aAnnahmen: gleiche Last je Sitzung; Skalierung 1,5- bis 1,9-fach je Verdopplung\u000d\u000ader Kerne; der VMware-Host liefert die zusätzliche Rechenzeit; Hyper-Threading\u000d\u000anicht eingerechnet; Vor einem Umbau mit einem Pilot oder Lasttest bestätigen.\u000d\u000a- In 1 von 5 Aufzeichnungen entzog der VMware-Host Rechenzeit; vor einem Umbau\u000d\u000a  den VMware-Host prüfen lassen.\u000d\u000a- Zu prüfen: Der Server darf nicht mehr vCPU haben als der VMware-Host\u000d\u000a  physische Kerne und soll in einen NUMA-Knoten passen; die Kernzahl des\u000d\u000a  VMware-Hosts ist im Server nicht sichtbar.\u000d\u000a\u000d\u000aArbeitsspeicher: Der Arbeitsspeicher reicht für die gemessene Last.\u000d\u000aHöchster zugesicherter Speicher der Hauptzeit 55,3 GB bei 64 GB RAM;\u000d\u000awiederkehrend: Kapazität (4 von 5).\u000d\u000a\u000d\u000aVMware-Host: VMware-Host prüfen lassen (CPU Ready, Co-Stop, Auslastung des\u000d\u000aVMware-Hosts); keine zusätzlichen vCPU, eher weniger, wenn Co-Stop hoch ist.\u000d\u000aDer VMware-Host entzog dem Server in 1 von 5 Aufzeichnungen Rechenzeit.\u000d\u000a- Am VMware-Host auffällig: CPU Ready je vCPU über 5 % (Warnung) und über 10 %\u000d\u000a  (handeln); Co-Stop anhaltend über 0 % prüfen (KB 431027), über 3 % je vCPU\u000d\u000a  sind es zu viele vCPU (KB 438023); Auslastung des VMware-Hosts anhaltend\u000d\u000a  über 70 bis 80 %.\u000d\u000a\u000d\u000aBelastbarkeit: 5 Aufzeichnungen, 5 h Messzeit, davon 3,7 h Hauptzeit. Achtung,\u000d\u000awenig Messzeit: 5 Aufzeichnungen mit 3,7 h Hauptzeit; belastbar ab 3\u000d\u000aAufzeichnungen und 12 h Hauptzeit.","anonymous":"Größe des Servers Server 01: Wiederkehrender CPU-Engpass aus Kapazität in 4\u000d\u000avon 5 Aufzeichnungen; typische Spitzenlast 93,7 % bei 31 Sitzungen.\u000d\u000a\u000d\u000aCPU: Mehr vCPU oder mehr Server.\u000d\u000aTypische Spitzenlast (P95 der Hauptzeit) 93,7 %, höchste Spitze 94,1 %, Ziel\u000d\u000aunter 75 %; wiederkehrend: Kapazität (4 von 5).\u000d\u000aSchätzung, nicht gemessen: Bei der gemessenen Last käme der Server mit etwa 12\u000d\u000astatt 8 vCPU unter 75 %.\u000d\u000aAnnahmen: gleiche Last je Sitzung; Skalierung 1,5- bis 1,9-fach je Verdopplung\u000d\u000ader Kerne; der VMware-Host liefert die zusätzliche Rechenzeit; Hyper-Threading\u000d\u000anicht eingerechnet; Vor einem Umbau mit einem Pilot oder Lasttest bestätigen.\u000d\u000a- In 1 von 5 Aufzeichnungen entzog der VMware-Host Rechenzeit; vor einem Umbau\u000d\u000a  den VMware-Host prüfen lassen.\u000d\u000a- Zu prüfen: Der Server darf nicht mehr vCPU haben als der VMware-Host\u000d\u000a  physische Kerne und soll in einen NUMA-Knoten passen; die Kernzahl des\u000d\u000a  VMware-Hosts ist im Server nicht sichtbar.\u000d\u000a\u000d\u000aArbeitsspeicher: Der Arbeitsspeicher reicht für die gemessene Last.\u000d\u000aHöchster zugesicherter Speicher der Hauptzeit 55,3 GB bei 64 GB RAM;\u000d\u000awiederkehrend: Kapazität (4 von 5).\u000d\u000a\u000d\u000aVMware-Host: VMware-Host prüfen lassen (CPU Ready, Co-Stop, Auslastung des\u000d\u000aVMware-Hosts); keine zusätzlichen vCPU, eher weniger, wenn Co-Stop hoch ist.\u000d\u000aDer VMware-Host entzog dem Server in 1 von 5 Aufzeichnungen Rechenzeit.\u000d\u000a- Am VMware-Host auffällig: CPU Ready je vCPU über 5 % (Warnung) und über 10 %\u000d\u000a  (handeln); Co-Stop anhaltend über 0 % prüfen (KB 431027), über 3 % je vCPU\u000d\u000a  sind es zu viele vCPU (KB 438023); Auslastung des VMware-Hosts anhaltend\u000d\u000a  über 70 bis 80 %.\u000d\u000a\u000d\u000aBelastbarkeit: 5 Aufzeichnungen, 5 h Messzeit, davon 3,7 h Hauptzeit. Achtung,\u000d\u000awenig Messzeit: 5 Aufzeichnungen mit 3,7 h Hauptzeit; belastbar ab 3\u000d\u000aAufzeichnungen und 12 h Hauptzeit."}}</script>
<script>
"use strict";
// Every value of the report data goes into the page as text (esc or textContent), never as markup.
const D = JSON.parse(document.getElementById("wp-data").textContent);
const M = D.meta;
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (v, d) => v == null || !isFinite(v) ? "–" : Number(v).toLocaleString("de-DE", { minimumFractionDigits: 0, maximumFractionDigits: d == null ? 1 : d });
const pad = (n) => String(n).padStart(2, "0");
// times in the local time of the server (the offset each recording carries)
function fmtDT(ms, offsetMin) {
  if (ms == null) return "–";
  const t = new Date(ms + (offsetMin || 0) * 60000);
  return `${pad(t.getUTCDate())}.${pad(t.getUTCMonth() + 1)}.${t.getUTCFullYear()} ${pad(t.getUTCHours())}:${pad(t.getUTCMinutes())}`;
}
const fmtDay = (ms, offsetMin) => fmtDT(ms, offsetMin).slice(0, 6);
const fmtDur = (min) => min == null ? "–" : min >= 90 ? fmt(min / 60, 1) + " h" : fmt(min, 0) + " min";
const RES = { cpu: "CPU", memory: "Arbeitsspeicher", host: "VMware-Host", singlecore: "Leistung je Kern" };
const END = { duration: "Dauer erreicht", stopped: "angehalten", maxsize: "Größengrenze erreicht", diskspace: "Speicherplatz knapp", error: "Fehler" };
const loadRuns = D.runs.filter((r) => !r.healthOnly), lastOffset = D.runs.length ? D.runs[D.runs.length - 1].offsetMin : 0;
const srcById = new Map(D.sources.map((s) => [s.id, s]));

// ---------- head ----------
document.getElementById("title").textContent = "Größe des Servers " + M.server;
document.title = "WorkerPerf – Größe des Servers " + M.server;
document.getElementById("subtitle").textContent =
  `${fmtDT(M.from, loadRuns.length ? loadRuns[0].offsetMin : 0)} bis ${fmtDT(M.to, lastOffset)} · ${fmt(M.recordings, 0)} ${M.recordings === 1 ? "Aufzeichnung" : "Aufzeichnungen"}` +
  (M.quick ? ` und ${fmt(M.quick, 0)} ${M.quick === 1 ? "Schnelllauf" : "Schnellläufe"}` : "") +
  ` · Messzeit ${fmtDur(M.durationMin)}, davon Hauptzeit ${fmt(M.mainHours, 1)} h · ${fmt(M.cores, 0)} vCPU, ${fmt(M.ramGB, 0)} GB RAM`;
if (M.sizeChanged) {
  const el = document.getElementById("sizeInfo"); el.hidden = false;
  el.textContent = "▲ Die Größe wechselte zwischen den Aufzeichnungen: " + M.sizes.map((s) => `${fmt(s.cores, 0)} vCPU / ${fmt(s.ramGB, 0)} GB`).join(" → ") + ". Die Hochrechnung geht von der letzten Aufzeichnung aus.";
}
if (M.mask) {
  const el = document.getElementById("maskInfo"); el.hidden = false;
  el.textContent = "● Bericht maskiert (Stufe " + M.mask + "): Namen sind durch Ersatznamen ersetzt.";
}
document.getElementById("result").textContent = D.result.text;

// ---------- recommendations ----------
function projectionNumber(p) {
  // a range of one number is shown as one number
  if (p.kind === "scaleOut") return `etwa ${fmt(p.sessions, 0)} ${p.unit} je Server`;
  return p.low === p.high ? `etwa ${fmt(p.low, 0)} ${p.unit}` : `etwa ${fmt(p.low, 0)} bis ${fmt(p.high, 0)} ${p.unit}`;
}
function sourceLinks(ids) {
  const seen = new Set(), out = [];
  for (const id of ids || []) { const s = srcById.get(id); if (!s || seen.has(s.url)) continue; seen.add(s.url); out.push(`<li><a href="${esc(s.url)}" rel="noopener noreferrer">${esc(s.title)}</a></li>`); }
  return out.join("");
}
function recHtml(r) {
  const g = D.grades[r.status] || { word: r.status, symbol: "" }, p = r.projection;
  const list = (title, items) => items && items.length ? `<h4>${title}</h4><ul>${items.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>` : "";
  const links = sourceLinks(r.sources);
  return `<article class="rec card st-${esc(r.status)}" data-resource="${esc(r.resource)}">
    <div class="rec-head"><span class="status"><i class="sym" aria-hidden="true">${esc(g.symbol)}</i> ${esc(g.word)}</span><h3>${esc(RES[r.resource] || r.resource)}</h3></div>
    <p class="dir">${esc(r.advice)}</p><p class="reason">${esc(r.reason)}</p>${p ? `
    <div class="proj"><span class="tag">Schätzung</span><span class="num">${esc(projectionNumber(p))}</span><p>${esc(p.text)}</p></div>` : ""}
    ${list("Annahmen", r.assumptions)}${list("Hinweise", r.hints)}${links ? `<h4>Quellen</h4><ul>${links}</ul>` : ""}
    <p class="rel">${esc(r.reliability)}</p></article>`;
}
document.getElementById("recommendations").innerHTML = D.recommendations.map(recHtml).join("");

// ---------- history: bars per recording, table, bottlenecks, recurring classes ----------
function barsSvg() {
  const W = 720, H = 220, L = 40, B = 30, T = 12, n = loadRuns.length, slot = (W - L - 10) / Math.max(n, 1), bw = Math.min(26, slot / 3);
  const y = (v) => T + (H - T - B) * (1 - Math.max(0, Math.min(100, v || 0)) / 100);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="CPU je Aufzeichnung: Spitze und P95, mit der Linie des Ziels">`;
  for (const g of [0, 25, 50, 75, 100]) s += `<line class="axis" x1="${L}" x2="${W - 10}" y1="${y(g)}" y2="${y(g)}"/><text x="${L - 6}" y="${y(g) + 4}" text-anchor="end">${g} %</text>`;
  loadRuns.forEach((r, i) => {
    const x = L + slot * i + slot / 2;
    s += `<rect class="bar peak" x="${x - bw - 1}" y="${y(r.cpu.peak)}" width="${bw}" height="${H - B - y(r.cpu.peak)}"><title>Aufzeichnung ${r.index}: Spitze ${esc(fmt(r.cpu.peak, 1))} %</title></rect>` +
      `<rect class="bar p95" x="${x + 1}" y="${y(r.cpu.p95)}" width="${bw}" height="${H - B - y(r.cpu.p95)}"><title>Aufzeichnung ${r.index}: P95 ${esc(fmt(r.cpu.p95, 1))} %</title></rect>` +
      `<text x="${x}" y="${H - B + 14}" text-anchor="middle">${esc(fmtDay(r.start, r.offsetMin))}</text>`;
  });
  s += `<line class="target" x1="${L}" x2="${W - 10}" y1="${y(M.target)}" y2="${y(M.target)}"/><text x="${W - 12}" y="${y(M.target) - 4}" text-anchor="end">Ziel ${esc(fmt(M.target, 0))} %</text></svg>`;
  return s;
}
{
  const rows = loadRuns.map((r) => `<tr><td class="num">${r.index}</td><td>${esc(fmtDT(r.start, r.offsetMin))}</td><td class="num">${esc(fmt(r.cpu.peak, 1))} / ${esc(fmt(r.cpu.p95, 1))}</td>` +
    `<td class="num">${esc(fmt(r.queue.peak, 1))} / ${esc(fmt(r.queue.p95, 1))}</td><td class="num">${esc(fmt(r.commit.peakGB, 1))} / ${esc(fmt(r.commit.p95GB, 1))}</td>` +
    `<td class="num">${esc(fmt(r.sessionsPeak, 0))}</td><td class="wrap">${(r.classLabels || []).length ? esc(r.classLabels.join("; ")) : "–"}</td></tr>`).join("");
  const bn = D.bottlenecks.map((b) => { const r = D.runs.find((x) => x.index === b.run) || {};
    return `<tr><td class="num">${b.run}</td><td>${esc(fmtDT(b.start, r.offsetMin))}</td><td class="num">${esc(fmtDur((b.end - b.start) / 60000))}</td><td class="wrap">${esc(b.label)}</td><td class="wrap">${b.app ? esc(b.app) : "–"}</td></tr>`; }).join("");
  const rec = D.recurring.length ? `<ul>${D.recurring.map((c) => `<li>${esc(c.label)}: in ${c.count} von ${c.of} Aufzeichnungen</li>`).join("")}</ul>` : `<p class="note">Keine Ursache kehrt in mindestens der Hälfte der Aufzeichnungen wieder.</p>`;
  document.getElementById("historyBody").innerHTML =
    `<div class="legend"><span><i style="background:var(--bar)"></i>Spitze der CPU</span><span><i style="background:var(--bar2)"></i>P95 der CPU</span><span>gestrichelt: Ziel</span></div>${barsSvg()}` +
    `<h3 style="margin-top:16px">Kennzahlen je Aufzeichnung</h3><div class="scroll"><table><thead><tr><th class="num">Nr.</th><th>Beginn</th><th class="num">CPU % Spitze / P95</th><th class="num">Warteschlange je CPU</th><th class="num">Zugesichert GB</th><th class="num">Sitzungen</th><th>Ursachen</th></tr></thead><tbody>${rows}</tbody></table></div>` +
    `<h3 style="margin-top:16px">Wiederkehrende Ursachen</h3>${rec}` +
    `<h3 style="margin-top:16px">Engpässe mit ihrer Einordnung</h3>` + (bn ? `<div class="scroll"><table><thead><tr><th class="num">Nr.</th><th>Beginn</th><th class="num">Dauer</th><th>Einordnung</th><th>Anwendung</th></tr></thead><tbody>${bn}</tbody></table></div>` : `<p class="note">Kein eingeordneter Vorfall in den Aufzeichnungen.</p>`);
}

// ---------- scatter: sessions against CPU over the main time ----------
{
  const W = 720, H = 260, L = 40, B = 34, T = 12, cpu = D.scatter.cpu, ses = D.scatter.sessions, maxS = Math.max(1, ...ses);
  const x = (v) => L + (W - L - 12) * (v / maxS), y = (v) => T + (H - T - B) * (1 - Math.max(0, Math.min(100, v)) / 100);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Punktwolke: CPU-Auslastung gegen die Zahl der Sitzungen in der Hauptzeit">`;
  for (const g of [0, 25, 50, 75, 100]) s += `<line class="axis" x1="${L}" x2="${W - 12}" y1="${y(g)}" y2="${y(g)}"/><text x="${L - 6}" y="${y(g) + 4}" text-anchor="end">${g} %</text>`;
  const step = Math.max(1, Math.ceil(maxS / 8));
  for (let v = 0; v <= maxS; v += step) s += `<text x="${x(v)}" y="${H - B + 14}" text-anchor="middle">${v}</text>`;
  s += `<text x="${(W + L) / 2}" y="${H - 4}" text-anchor="middle">Sitzungen</text>`;
  for (let i = 0; i < cpu.length; i++) s += `<circle class="pt" cx="${x(ses[i]).toFixed(1)}" cy="${y(cpu[i]).toFixed(1)}" r="2.2"/>`;
  s += `<line class="target" x1="${L}" x2="${W - 12}" y1="${y(D.scatter.target)}" y2="${y(D.scatter.target)}"/><text x="${W - 14}" y="${y(D.scatter.target) - 4}" text-anchor="end">Ziel ${esc(fmt(D.scatter.target, 0))} %</text></svg>`;
  document.getElementById("scatterBody").innerHTML = cpu.length ? s + `<p class="note">Jeder Punkt ist ein Takt der Hauptzeit (höchstens 2000 Punkte). Typische Spitzenlast (P95): ${esc(fmt(M.load, 1))} %, höchste Spitze ${esc(fmt(M.peak, 1))} %.</p>`
    : `<p class="note">Keine Hauptzeit in den Aufzeichnungen (keine Sitzungen): keine Punkte.</p>`;
}

// ---------- sessions per vCPU ----------
{
  const u = D.usersPerVcpu;
  document.getElementById("usersBody").innerHTML =
    `<p>Höchste Sitzungszahl ${esc(fmt(u.sessionsPeak, 0))} auf ${esc(fmt(u.cores, 0))} vCPU: ${esc(fmt(u.value, 2))} Sitzungen je vCPU.</p>` +
    `<div class="scroll"><table><thead><tr><th>Art der Nutzer</th><th class="num">Obergrenze je vCPU</th><th class="num">Sitzungen bei ${esc(fmt(u.cores, 0))} vCPU</th></tr></thead><tbody>` +
    u.limits.map((l) => `<tr><td>${esc(l.label)}</td><td class="num">${esc(fmt(l.perVcpu, 0))}</td><td class="num">${esc(fmt(l.sessions, 0))}</td></tr>`).join("") + `</tbody></table></div><p class="note">${esc(u.note)}</p>`;
}

// ---------- evidence, recordings, sources ----------
document.getElementById("evidenceBody").innerHTML = D.evidence.length
  ? `<div class="scroll"><table><tbody>${D.evidence.map((e) => `<tr><th>${esc(e.label)}</th><td class="wrap">${esc(e.value)}</td></tr>`).join("")}</tbody></table></div>`
  : `<p class="note">Keine Aufzeichnung enthält ein Zustandsbild.</p>`;
document.getElementById("runsBody").innerHTML = `<div class="scroll"><table><thead><tr><th class="num">Nr.</th><th>Ordner</th><th>Beginn</th><th class="num">Dauer</th><th>Ende</th><th>Bericht dieser Aufzeichnung</th></tr></thead><tbody>` +
  D.runs.map((r, i) => `<tr><td class="num">${r.index}</td><td class="wrap">${esc(r.folder)}</td><td>${esc(fmtDT(r.start, r.offsetMin))}</td>` +
    `<td class="num">${r.healthOnly ? "–" : esc(fmtDur(r.durationMin))}</td><td>${r.healthOnly ? "Schnelllauf (zählt nicht für die Last)" : esc(END[r.endReason] || r.endReason || "–")}</td>` +
    `<td class="wrap"><code>${esc(r.command)}</code><br><button type="button" class="btn small cmd" data-run="${i}">Befehl kopieren</button></td></tr>`).join("") + `</tbody></table></div>`;
document.getElementById("sourcesBody").innerHTML = (() => {
  const seen = new Map();
  for (const s of D.sources) { if (!seen.has(s.url)) seen.set(s.url, { s, ids: [] }); seen.get(s.url).ids.push(s.id); }
  return `<ul>${[...seen.values()].map((o) => `<li><a href="${esc(o.s.url)}" rel="noopener noreferrer">${esc(o.s.title)}</a> <span class="rel">(${o.s.kind === "practice" ? "Praxisquelle" : "Herstellerangabe"}, Stand ${esc(o.s.date)}; ${esc(o.ids.join(", "))})</span></li>`).join("")}</ul>` +
    `<p class="note">Werte ohne Quelle sind Faustregeln des Katalogs (Fassung ${esc(M.catalogueVersion)}).</p>`;
})();

// ---------- copy ----------
async function copyText(text, done) {
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand("copy"); } catch (e2) { ok = false; }
    ta.remove();
  }
  if (done) done.textContent = ok ? "Kopiert." : "Kopieren nicht möglich: bitte den Text markieren und kopieren.";
}
{
  const anon = document.getElementById("anon"), pre = document.getElementById("copyText"), done = document.getElementById("copyDone");
  // a masked report has one version only
  if (M.mask || D.copy.anonymous == null) document.getElementById("anonLabel").hidden = true;
  const current = () => anon.checked && D.copy.anonymous != null ? D.copy.anonymous : D.copy.named;
  const show = () => { pre.textContent = current() || ""; done.textContent = ""; };
  anon.addEventListener("change", show); show();
  document.getElementById("copyBtn").addEventListener("click", () => copyText(current() || "", done));
  document.getElementById("runsBody").addEventListener("click", (ev) => {
    const b = ev.target.closest("button.cmd"); if (!b) return;
    copyText(D.runs[Number(b.dataset.run)].command, null).then(() => { b.textContent = "Kopiert"; setTimeout(() => { b.textContent = "Befehl kopieren"; }, 1500); });
  });
}
document.getElementById("footer").textContent = `Zeiten in Ortszeit des Servers. Bericht erstellt am ${fmtDT(M.generated, lastOffset)} mit WorkerPerf. Jede Zahl einer Hochrechnung ist eine Schätzung, nicht gemessen.`;
</script>
</body>
</html>
